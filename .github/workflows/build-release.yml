name: Advanced Multi-Repo Build

on:
  workflow_dispatch:
    inputs:
      refs:
        description: "Comma-separated refs (e.g., main,stable,testing)"
        default: "main,oldstable,stable,testing"
      platforms:
        description: "Comma-separated platforms (e.g., linux/amd64,windows/amd64)"
        default: "linux/amd64,linux/arm64,windows/amd64"
  schedule:
    - cron: '0 0 * * *'

env:
  DEFAULT_WORKSPACE_DIR: workspace

jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - id: generate
        name: Generate and Validate Build Matrix
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_JSON='[
            {
              "repo": "sing-box",
              "repo_url": "https://github.com/sagernet/sing-box.git",
              "go_version": "1.27",
              "ldflags_template": "-X github.com/sagernet/sing-box/constant.Version=${REPO_TAG}",
              "tags": "with_gvisor,with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0",
              "target": "./cmd/sing-box",
              "cgo_enabled": "0",
              "refs_default": ["oldstable", "stable", "testing"],
              "platforms_default": ["linux/amd64", "linux/arm64", "windows/amd64"]
            },
            {
              "repo": "xray-core",
              "repo_url": "https://github.com/XTLS/Xray-core.git",
              "go_version": "1.27",
              "ldflags_template": "-X github.com/xtls/xray-core/core.build=${REPO_SHORT_SHA}",
              "tags": "",
              "target": "./main",
              "cgo_enabled": "0",
              "refs_default": ["main"],
              "platforms_default": ["linux/amd64", "linux/arm64", "windows/amd64"]
            }
          ]'

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DISPATCH_REFS="${{ inputs.refs }}"
            DISPATCH_PLATFORMS="${{ inputs.platforms }}"
          else
            DISPATCH_REFS=""
            DISPATCH_PLATFORMS=""
          fi

          MATRIX='[]'
          mapfile -t REPO_ROWS < <(echo "${CONFIG_JSON}" | jq -c '.[]')

          for ROW in "${REPO_ROWS[@]}"; do
            REPO="$(echo "${ROW}" | jq -r '.repo')"
            REPO_URL="$(echo "${ROW}" | jq -r '.repo_url')"

            if [[ -n "${DISPATCH_REFS}" ]]; then
              REF_CSV="${DISPATCH_REFS}"
            else
              REF_CSV="$(echo "${ROW}" | jq -r '.refs_default | join(",")')"
            fi

            if [[ -n "${DISPATCH_PLATFORMS}" ]]; then
              PLATFORM_CSV="${DISPATCH_PLATFORMS}"
            else
              PLATFORM_CSV="$(echo "${ROW}" | jq -r '.platforms_default | join(",")')"
            fi

            IFS=',' read -ra REFS <<< "${REF_CSV}"
            IFS=',' read -ra PLATFORMS <<< "${PLATFORM_CSV}"

            for REF in "${REFS[@]}"; do
              REF="$(echo "${REF}" | xargs)"
              [[ -z "${REF}" ]] && continue

              REF_KIND=""
              CHECKOUT_REF="${REF}"
              TAG_REF="${REF#refs/tags/}"
              TAG_REF="${TAG_REF#tags/}"

              if echo "${ROW}" | jq -e --arg ref "${REF}" '.refs_default | index($ref)' >/dev/null; then
                if git ls-remote --exit-code --heads "${REPO_URL}" "${REF}" >/dev/null 2>&1; then
                  REF_KIND="branch"
                elif git ls-remote --exit-code --refs --tags "${REPO_URL}" "refs/tags/${TAG_REF}" >/dev/null 2>&1; then
                  REF="${TAG_REF}"
                  REF_KIND="tag"
                  CHECKOUT_REF="refs/tags/${REF}"
                else
                  echo "skip missing ref: ${REPO} ${REF}"
                  continue
                fi
              elif git ls-remote --exit-code --refs --tags "${REPO_URL}" "refs/tags/${TAG_REF}" >/dev/null 2>&1; then
                REF="${TAG_REF}"
                REF_KIND="tag"
                CHECKOUT_REF="refs/tags/${REF}"
              else
                echo "skip unsupported ref: ${REPO} ${REF}"
                continue
              fi

              for PLATFORM in "${PLATFORMS[@]}"; do
                PLATFORM="$(echo "${PLATFORM}" | xargs)"
                [[ -z "${PLATFORM}" ]] && continue

                OS="${PLATFORM%%/*}"
                ARCH="${PLATFORM##*/}"
                if [[ "${OS}" == "${ARCH}" ]]; then
                  echo "skip invalid platform: ${PLATFORM}"
                  continue
                fi

                ENTRY="$(echo "${ROW}" | jq -c \
                  --arg ref "${REF}" \
                  --arg ref_kind "${REF_KIND}" \
                  --arg checkout_ref "${CHECKOUT_REF}" \
                  --arg os "${OS}" \
                  --arg arch "${ARCH}" \
                  '{
                    repo: .repo,
                    repo_url: .repo_url,
                    build_go_version: .go_version,
                    build_ldflags: .ldflags_template,
                    build_tags: .tags,
                    build_target: .target,
                    cgo_enabled: .cgo_enabled,
                    ref: $ref,
                    ref_kind: $ref_kind,
                    checkout_ref: $checkout_ref,
                    os: $os,
                    arch: $arch
                  }')"

                MATRIX="$(echo "${MATRIX}" | jq -c ". + [${ENTRY}]")"
              done
            done
          done

          if [[ "$(echo "${MATRIX}" | jq 'length')" -eq 0 ]]; then
            echo "No build tasks were generated."
            exit 1
          fi

          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  build:
    needs: prepare-assets
    name: Build ${{ matrix.repo }} | ${{ matrix.ref }} | ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-assets.outputs.matrix) }}
    steps:
      - name: Extract Owner/Repo from URL
        id: extract_repo
        shell: bash
        run: |
          set -euo pipefail
          REPO_URL="${{ matrix.repo_url }}"
          OWNER_REPO="${REPO_URL#https://github.com/}"
          OWNER_REPO="${OWNER_REPO%.git}"
          echo "owner_repo=${OWNER_REPO}" >> "${GITHUB_OUTPUT}"

      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.extract_repo.outputs.owner_repo }}
          ref: ${{ matrix.checkout_ref }}
          path: ${{ env.DEFAULT_WORKSPACE_DIR }}/${{ matrix.repo }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.build_go_version }}
          check-latest: true
          cache-dependency-path: ${{ env.DEFAULT_WORKSPACE_DIR }}/${{ matrix.repo }}/**/go.sum

      - name: Build for ${{ matrix.repo }} - ${{ matrix.ref }} - ${{ matrix.os }}/${{ matrix.arch }}
        id: compile
        shell: bash
        env:
          REPO_NAME: ${{ matrix.repo }}
          TARGET_REF: ${{ matrix.ref }}
          TARGET_REF_KIND: ${{ matrix.ref_kind }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          WORKSPACE_DIR: ${{ env.DEFAULT_WORKSPACE_DIR }}
          BUILD_TAGS: ${{ matrix.build_tags }}
          BUILD_LDFLAGS: ${{ matrix.build_ldflags }}
          BUILD_TARGET: ${{ matrix.build_target }}
          CGO_MODE: ${{ matrix.cgo_enabled }}
        run: |
          set -euo pipefail

          cd "${WORKSPACE_DIR}/${REPO_NAME}"
          REPO_SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          REPO_LONG_SHA="$(git rev-parse HEAD)"
          REPO_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          if [[ "${REPO_NAME}" == "sing-box" ]]; then
            if [[ ! -f "cmd/internal/read_tag/main.go" ]]; then
              echo "Missing sing-box read_tag helper at ${REPO_LONG_SHA}" >&2
              exit 1
            fi
            if [[ "${TARGET_REF_KIND}" == "tag" ]]; then
              REPO_TAG="${TARGET_REF}"
            else
              case "${TARGET_REF}" in
                testing)
                  REPO_TAG="$(go run ./cmd/internal/read_tag --nightly)"
                  ;;
                oldstable|stable)
                  REPO_TAG="$(go run ./cmd/internal/read_tag)"
                  ;;
                *)
                  echo "Unsupported sing-box branch ref: ${TARGET_REF}" >&2
                  exit 1
                  ;;
              esac
            fi
            REPO_TAG="${REPO_TAG%-dirty}"
            REPO_TAG="${REPO_TAG#v}"
            if [[ -z "${REPO_TAG}" || "${REPO_TAG}" == "unknown" ]]; then
              echo "No tag version found for sing-box at ${REPO_LONG_SHA}" >&2
              exit 1
            fi
          fi

          FINAL_LDFLAGS="${BUILD_LDFLAGS:-}"
          FINAL_LDFLAGS="${FINAL_LDFLAGS//\$\{REPO_TAG\}/${REPO_TAG}}"
          FINAL_LDFLAGS="${FINAL_LDFLAGS//\$\{REPO_SHORT_SHA\}/${REPO_SHORT_SHA}}"
          FINAL_LDFLAGS="${FINAL_LDFLAGS//\$\{REPO_LONG_SHA\}/${REPO_LONG_SHA}}"

          if [[ "${REPO_NAME}" == "sing-box" ]]; then
            LDFLAGS_SHARED_FALLBACK="-X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0"
            if [[ -f "release/LDFLAGS" ]]; then
              LDFLAGS_SHARED="$(tr -d '\r\n' < release/LDFLAGS)"
            else
              LDFLAGS_SHARED="${LDFLAGS_SHARED_FALLBACK}"
            fi
            FINAL_LDFLAGS="${FINAL_LDFLAGS} ${LDFLAGS_SHARED}"
          fi

          FINAL_LDFLAGS="$(echo "${FINAL_LDFLAGS}" | xargs)"
          FINAL_LDFLAGS="${FINAL_LDFLAGS:+${FINAL_LDFLAGS} }-s -w -buildid="

          export GOOS="${TARGET_OS}"
          export GOARCH="${TARGET_ARCH}"
          export CGO_ENABLED="${CGO_MODE}"

          SAFE_REF="${TARGET_REF//\//_}"
          SAFE_REF="${SAFE_REF//:/_}"
          OUTPUT_NAME="${REPO_NAME}-${SAFE_REF}-${TARGET_OS}-${TARGET_ARCH}"
          if [[ "${TARGET_OS}" == "windows" ]]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi

          mkdir -p "${GITHUB_WORKSPACE}/dist"
          OUTPUT_PATH="${GITHUB_WORKSPACE}/dist/${OUTPUT_NAME}"

          BUILD_ARGS=( -v -trimpath -buildvcs=false )
          if [[ -n "${BUILD_TAGS}" ]]; then
            BUILD_ARGS+=( -tags "${BUILD_TAGS}" )
          fi
          if [[ -n "${FINAL_LDFLAGS}" ]]; then
            BUILD_ARGS+=( -ldflags "${FINAL_LDFLAGS}" )
          fi
          BUILD_ARGS+=( -o "${OUTPUT_PATH}" "${BUILD_TARGET}" )

          echo "::group::Final Build Flags (${REPO_NAME}/${TARGET_REF}/${TARGET_OS}-${TARGET_ARCH})"
          cat <<EOF
          build_tags: ${BUILD_TAGS:-<none>}
          EOF
          if [[ -n "${REPO_TAG}" ]]; then
            echo "          repo_tag: ${REPO_TAG}"
          fi
          echo "          ldflags: ${FINAL_LDFLAGS}"
          echo "::endgroup::"

          go build "${BUILD_ARGS[@]}"

          echo "artifact_path=${OUTPUT_PATH}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${REPO_NAME}-${SAFE_REF}-${TARGET_OS}-${TARGET_ARCH}" >> "${GITHUB_OUTPUT}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.compile.outputs.artifact_name }}
          path: ${{ steps.compile.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 1
