name: Daily Android APK Build

on:
  workflow_dispatch:
    inputs:
      refs:
        description: "Comma-separated refs for sing-box (e.g., main,main-next,dev-next)"
        default: "main,main-next,dev-next"
  schedule:
    - cron: '0 0 * * *'

jobs:
  prepare-android-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - id: generate
        name: Generate and Validate Android Build Matrix
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_JSON='[
            {
              "repo": "sing-box",
              "repo_url": "https://github.com/SagerNet/sing-box.git",
              "go_version": "1.26",
              "ndk_version": "r28",
              "jdk_version": "17",
              "client_path": "clients/android",
              "gradle_task": ":app:assemblePlayRelease :app:assembleOtherRelease",
              "libbox_tags": "with_gvisor,with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0",
              "refs_default": ["main", "main-next", "dev-next"]
            },
            {
              "repo": "sing-box-custom",
              "repo_url": "https://github.com/XavierAlpha/sing-box.git",
              "go_version": "1.26",
              "ndk_version": "r28",
              "jdk_version": "17",
              "client_path": "clients/android",
              "gradle_task": ":app:assemblePlayRelease :app:assembleOtherRelease",
              "libbox_tags": "with_gvisor,with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0",
              "refs_default": ["main-next"]
            }
          ]'

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DISPATCH_REFS="${{ inputs.refs }}"
          else
            DISPATCH_REFS=""
          fi

          MATRIX='[]'
          mapfile -t REPO_ROWS < <(echo "${CONFIG_JSON}" | jq -c '.[]')

          for ROW in "${REPO_ROWS[@]}"; do
            REPO="$(echo "${ROW}" | jq -r '.repo')"
            REPO_URL="$(echo "${ROW}" | jq -r '.repo_url')"

            if [[ -n "${DISPATCH_REFS}" ]]; then
              REF_CSV="${DISPATCH_REFS}"
            else
              REF_CSV="$(echo "${ROW}" | jq -r '.refs_default | join(",")')"
            fi

            IFS=',' read -ra REFS <<< "${REF_CSV}"
            for REF in "${REFS[@]}"; do
              REF="$(echo "${REF}" | xargs)"
              [[ -z "${REF}" ]] && continue

              if ! git ls-remote --exit-code --heads --tags "${REPO_URL}" "${REF}" >/dev/null 2>&1; then
                echo "skip missing ref: ${REPO} ${REF}"
                continue
              fi

              ENTRY="$(echo "${ROW}" | jq -c \
                --arg ref "${REF}" \
                '{
                  repo: .repo,
                  repo_url: .repo_url,
                  build_go_version: .go_version,
                  build_ndk_version: .ndk_version,
                  build_jdk_version: .jdk_version,
                  client_path: .client_path,
                  gradle_task: .gradle_task,
                  libbox_tags: .libbox_tags,
                  ref: $ref
                }')"

              MATRIX="$(echo "${MATRIX}" | jq -c ". + [${ENTRY}]")"
            done
          done

          if [[ "$(echo "${MATRIX}" | jq 'length')" -eq 0 ]]; then
            echo "No Android build tasks were generated."
            exit 1
          fi

          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  build-apk:
    needs: prepare-android-matrix
    name: Build Android ${{ matrix.repo }} | ${{ matrix.ref }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-android-matrix.outputs.matrix) }}
    steps:
      - name: Extract Owner/Repo from URL
        id: extract_repo
        shell: bash
        run: |
          set -euo pipefail
          REPO_URL="${{ matrix.repo_url }}"
          OWNER_REPO="${REPO_URL#https://github.com/}"
          OWNER_REPO="${OWNER_REPO%.git}"
          echo "owner_repo=${OWNER_REPO}" >> "${GITHUB_OUTPUT}"

      - name: Checkout Source Code
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.extract_repo.outputs.owner_repo }}
          ref: ${{ matrix.ref }}
          path: source
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Align Android client branch
        if: ${{ steps.extract_repo.outputs.owner_repo == 'SagerNet/sing-box' || steps.extract_repo.outputs.owner_repo == 'XavierAlpha/sing-box' }}
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          case "${{ matrix.ref }}" in
            dev-next)
              git -C clients/android fetch origin dev
              git -C clients/android checkout dev
              ;;
            main-next|main)
              git -C clients/android fetch origin main
              git -C clients/android checkout main
              ;;
            *)
              ;;
          esac

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.build_go_version }}
          check-latest: true
          cache-dependency-path: source/**/go.sum

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.build_jdk_version }}
          cache: gradle

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ matrix.build_ndk_version }}

      - name: Install Go Mobile Tools
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          go install -v github.com/sagernet/gomobile/cmd/gomobile@latest
          go install -v github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Build Custom libbox.aar (API 23 only)
        shell: bash
        working-directory: source
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail

          VERSION="$(go run ./cmd/internal/read_tag 2>/dev/null || git describe --tags --always --dirty)"
          LDFLAGS_SHARED_FALLBACK="-X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0"
          if [[ -f "release/LDFLAGS" ]]; then
            LDFLAGS_SHARED="$(tr -d '\r\n' < release/LDFLAGS)"
          else
            LDFLAGS_SHARED="${LDFLAGS_SHARED_FALLBACK}"
          fi
          FINAL_LDFLAGS="-X github.com/sagernet/sing-box/constant.Version=${VERSION} ${LDFLAGS_SHARED}"
          FINAL_LDFLAGS="$(echo "${FINAL_LDFLAGS}" | xargs)"
          FINAL_LDFLAGS="${FINAL_LDFLAGS:+${FINAL_LDFLAGS} }-s -w -buildid="

          echo "::group::Final Build Flags (${{ matrix.repo }}/${{ matrix.ref }}/libbox)"
          cat <<EOF
          build_tags: ${{ matrix.libbox_tags }}
          ldflags: ${FINAL_LDFLAGS}
          EOF
          echo "::endgroup::"

          go run ./cmd/internal/build gomobile bind -v \
            -o libbox.aar \
            -target android \
            -androidapi 23 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -trimpath \
            -buildvcs=false \
            -ldflags "${FINAL_LDFLAGS}" \
            -tags "${{ matrix.libbox_tags }}" \
            ./experimental/libbox

          mkdir -p "${{ matrix.client_path }}/app/libs"
          cp -f libbox.aar "${{ matrix.client_path }}/app/libs/libbox.aar"
          rm -f "${{ matrix.client_path }}/app/libs/libbox-legacy.aar"

      - name: Decode Keystore and Setup Properties
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          echo -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > "${{ matrix.client_path }}/app/release.keystore"
          echo -n "${{ secrets.LOCAL_PROPERTIES }}" | base64 --decode > "${{ matrix.client_path }}/local.properties"

      - name: Build Android APK
        shell: bash
        working-directory: source/${{ matrix.client_path }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon ${{ matrix.gradle_task }}

      - name: Prepare upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          shopt -s nullglob
          APK_FILES=(
            source/${{ matrix.client_path }}/app/build/outputs/apk/play/release/*.apk
            source/${{ matrix.client_path }}/app/build/outputs/apk/other/release/*.apk
          )

          if [[ ${#APK_FILES[@]} -eq 0 ]]; then
            echo "No APK found to upload."
            exit 1
          fi

          SAFE_REF="${{ matrix.ref }}"
          SAFE_REF="${SAFE_REF//\//_}"
          SAFE_REF="${SAFE_REF//:/_}"

          for FILE in "${APK_FILES[@]}"; do
            BASE="$(basename "${FILE}")"
            cp -f "${FILE}" "dist/${{ matrix.repo }}-${SAFE_REF}-${BASE}"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.repo }}-${{ matrix.ref }}-android
          path: dist
          if-no-files-found: error
          retention-days: 1
