name: Daily Android APK Build

on:
  workflow_dispatch:
    inputs:
      refs:
        description: "Comma-separated refs for sing-box (e.g., main,dev-next)"
        default: "main,main-next,dev-next"
  schedule:
    - cron: '0 0 * * *' # Runs at 0:00 UTC every day

env:
  DEFAULT_WORKSPACE_DIR: workspace

jobs:
  prepare-android-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - id: generate
        name: Generate and Validate Android Build Matrix
        run: |
          set -e
          FINAL_MATRIX_JSON="[]"

          # --- Android Build Configuration ---
          # Format (semicolon-separated):
          # 1. Git Repo URL         (repo_url)
          # 2. Go Version           (go_ver)
          # 3. NDK Version          (ndk_ver)
          # 4. JDK Version          (jdk_ver)
          # 5. Android Client Path  (client_path)
          # 6. Lib Install Command  (lib_install_cmd) - e.g., 'make lib_install'
          # 7. Lib Build Command    (lib_build_cmd) - e.g., 'make lib_android'
          # 8. Output AAR Name      (aar_name)
          # 9. Version Update Cmd   (version_update_cmd) - Command to sync version into Android project
          # 10. Gradle Build Tasks  (gradle_task) - e.g., ':app:assembleRelease'
          declare -A REPOS
          REPOS["sing-box"]="https://github.com/SagerNet/sing-box.git;1.25;r28;17;clients/android;make lib_install && export PATH="$PATH:$(go env GOPATH)/bin";make lib_android;*.aar;go run ./cmd/internal/update_android_version --ci --nightly;:app:assemblePlayRelease :app:assembleOtherRelease"
          REPOS["sing-box-custom"]="https://github.com/XavierAlpha/sing-box.git;1.25;r28;17;clients/android;make lib_install && export PATH="$PATH:$(go env GOPATH)/bin";make lib_android;*.aar;go run ./cmd/internal/update_android_version --ci --nightly;:app:assemblePlayRelease :app:assembleOtherRelease"
          # Add other repositories here if needed.

          declare -A DEFAULT_REFS
          DEFAULT_REFS["sing-box"]="main,main-next,dev-next"
          DEFAULT_REFS["sing-box-custom"]="main-next"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CHECK_REFS="${{ inputs.refs }}"
          else
            CHECK_REFS=""
          fi

          for repo_name in "${!REPOS[@]}"; do
            IFS=';' read -r repo_url go_ver ndk_ver jdk_ver client_path lib_install_cmd lib_build_cmd aar_name version_update_cmd gradle_task <<< "${REPOS[$repo_name]}"

            if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
              CHECK_REFS="${DEFAULT_REFS[$repo_name]}"
            fi

            IFS=',' read -ra refs_to_check <<< "$CHECK_REFS"

            for ref in "${refs_to_check[@]}"; do
              echo "Checking if ref '$ref' exists in repo '$repo_name'..."
              if git ls-remote --exit-code --heads --tags "$repo_url" "$ref" >/dev/null 2>&1; then
                echo "  -> Ref '$ref' found. Adding to matrix."

                VALID_COMBO=$(jq -n \
                  --arg rn "$repo_name" --arg rurl "$repo_url" \
                  --arg gv "$go_ver" --arg nv "$ndk_ver" --arg jv "$jdk_ver" \
                  --arg cp "$client_path" --arg lic "$lib_install_cmd" --arg lbc "$lib_build_cmd" \
                  --arg an "$aar_name" --arg vuc "$version_update_cmd" --arg gt "$gradle_task" \
                  --arg r "$ref" \
                  '{
                    repo: $rn, repo_url: $rurl, build_go_version: $gv,
                    build_ndk_version: $nv, build_jdk_version: $jv,
                    client_path: $cp, lib_install_cmd: $lic, lib_build_cmd: $lbc,
                    aar_name: $an, version_update_cmd: $vuc, gradle_task: $gt,
                    ref: $r
                  }'
                )
                FINAL_MATRIX_JSON=$(echo "$FINAL_MATRIX_JSON" | jq -c ". += [$VALID_COMBO]")
              else
                echo "  -> Ref '$ref' NOT found. Skipping."
              fi
            done
          done

          echo "Final Generated Matrix:"
          echo "$FINAL_MATRIX_JSON" | jq .
          echo "matrix=$FINAL_MATRIX_JSON" >> "$GITHUB_OUTPUT"

  build-apk:
    needs: prepare-android-matrix
    name: 📦 Build Android ${{ matrix.repo }} | ${{ matrix.ref }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-android-matrix.outputs.matrix) }}
    steps:
      - name: Extract Owner/Repo from URL
        id: extract_repo
        run: |
          REPO_URL="${{ matrix.repo_url }}"
          OWNER_REPO="${REPO_URL#https://github.com/}"
          OWNER_REPO="${OWNER_REPO%.git}"
          echo "owner_repo=${OWNER_REPO}" >> "$GITHUB_OUTPUT"

      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.extract_repo.outputs.owner_repo }}
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          fetch-tags: true
          submodules: 'recursive'
      
      - name: Align android client branch
        if: ${{ steps.extract_repo.outputs.owner_repo }} == "SagerNet/sing-box" || ${{ steps.extract_repo.outputs.owner_repo }} == "XavierAlpha/sing-box"
        run: |
          set -eux
          case "${{ matrix.ref }}" in
            dev-next)
              git -C clients/android fetch origin dev
              git -C clients/android checkout dev
              ;;
            main-next|main)
              git -C clients/android fetch origin main
              git -C clients/android checkout main
              ;;
            *)
              # default
              ;;
          esac

      - name: Strip tags (AST patch) and print final init()
        shell: bash
        env:
          STRIP_TAGS: with_wireguard,with_naive_outbound,with_tailscale
        run: |
          set -euo pipefail
          FILE=cmd/internal/build_libbox/main.go
      
          cat > /tmp/patch_tags.go <<'EOF'
          package main
      
          import (
            "bytes"
            "fmt"
            "go/ast"
            "go/format"
            "go/parser"
            "go/token"
            "os"
            "strconv"
            "strings"
          )
      
          func main() {
            if len(os.Args) != 2 {
              fmt.Fprintln(os.Stderr, "usage: patch_tags <file.go>")
              os.Exit(2)
            }
            path := os.Args[1]
      
            removeAny := map[string]bool{
              "with_wireguard":      true,
              "with_naive_outbound": true,
              "with_tailscale":      true,
            }
            if env := strings.TrimSpace(os.Getenv("STRIP_TAGS")); env != "" {
              removeAny = map[string]bool{}
              for _, t := range strings.Split(env, ",") {
                t = strings.TrimSpace(t)
                if t != "" {
                  removeAny[t] = true
                }
              }
            }
      
            fset := token.NewFileSet()
            f, err := parser.ParseFile(fset, path, nil, parser.ParseComments)
            if err != nil {
              fmt.Fprintln(os.Stderr, "parse:", err)
              os.Exit(1)
            }
      
            isRemoveStringLit := func(e ast.Expr) bool {
              bl, ok := e.(*ast.BasicLit)
              if !ok || bl.Kind != token.STRING {
                return false
              }
              s, err := strconv.Unquote(bl.Value)
              if err != nil {
                return false
              }
              return removeAny[s]
            }
      
            isStringSliceType := func(t ast.Expr) bool {
              at, ok := t.(*ast.ArrayType)
              if !ok || at.Len != nil {
                return false
              }
              id, ok := at.Elt.(*ast.Ident)
              return ok && id.Name == "string"
            }
      
            ast.Inspect(f, func(n ast.Node) bool {
              if call, ok := n.(*ast.CallExpr); ok {
                if fun, ok := call.Fun.(*ast.Ident); ok && fun.Name == "append" && len(call.Args) >= 2 {
                  kept := []ast.Expr{call.Args[0]}
                  for _, a := range call.Args[1:] {
                    if isRemoveStringLit(a) {
                      continue
                    }
                    kept = append(kept, a)
                  }
                  call.Args = kept
                }
      
                if fun, ok := call.Fun.(*ast.Ident); ok && fun.Name == "filterTags" && len(call.Args) >= 2 {
                  kept := []ast.Expr{call.Args[0]}
                  for _, a := range call.Args[1:] {
                    if isRemoveStringLit(a) {
                      continue
                    }
                    kept = append(kept, a)
                  }
                  call.Args = kept
                }
              }
      
              if cl, ok := n.(*ast.CompositeLit); ok && cl.Type != nil && isStringSliceType(cl.Type) {
                var kept []ast.Expr
                for _, e := range cl.Elts {
                  if isRemoveStringLit(e) {
                    continue
                  }
                  kept = append(kept, e)
                }
                cl.Elts = kept
              }
      
              return true
            })
      
            var buf bytes.Buffer
            if err := format.Node(&buf, fset, f); err != nil {
              fmt.Fprintln(os.Stderr, "format:", err)
              os.Exit(1)
            }
            if err := os.WriteFile(path, buf.Bytes(), 0644); err != nil {
              fmt.Fprintln(os.Stderr, "write:", err)
              os.Exit(1)
            }
          }
          EOF
      
          go build -o /tmp/patch_tags /tmp/patch_tags.go
          /tmp/patch_tags "$FILE"
      
          TAGS="${STRIP_TAGS:-with_wireguard,with_naive_outbound,with_tailscale}"
          IFS=',' read -r -a arr <<< "$TAGS"
          for t in "${arr[@]}"; do
            t="$(echo "$t" | xargs)"
            [ -z "$t" ] && continue
            if grep -q "\"$t\"" "$FILE"; then
              echo "::error::$t tag still present in $FILE"
              grep -n "\"$t\"" "$FILE" || true
              exit 1
            fi
          done
      
          echo "✔️ AST patch applied to $FILE"
          echo
          echo "==== Patched func init() (final flags/tags) ===="
          awk -v want=2 '
            BEGIN { count=0; inside=0; depth=0 }
      
            /^[[:space:]]*func[[:space:]]+init[[:space:]]*\(\)[[:space:]]*{/ {
              count++
              if (count == want) { inside=1; depth=0 } else { inside=0 }
            }
      
            inside {
              print
              line=$0
              opens  = gsub(/{/, "{", line)
              closes = gsub(/}/, "}", line)
              depth += opens - closes
              if (depth == 0) exit
            }
          ' "$FILE" | nl -ba

      - name: Patch out Android legacy AAR (API 21) block if present
        shell: bash
        run: |
          set -euo pipefail
          FILE="cmd/internal/build_libbox/main.go"
      
          if [[ ! -f "$FILE" ]]; then
            echo "Skip: $FILE not found."
            exit 0
          fi
      
          if ! grep -qE 'libbox-legacy\.aar|AndroidAPI:\s*21|Build legacy variant' "$FILE"; then
            echo "Skip: legacy block not detected in $FILE."
            exit 0
          fi
      
          python3 - <<'PY'
          import re, pathlib, sys
          p = pathlib.Path("cmd/internal/build_libbox/main.go")
          s = p.read_text()
      
          pattern = re.compile(
            r"""
            \n[ \t]*//[ \t]*Build[ \t]+legacy[ \t]+variant[^\n]*\n
            [\s\S]*?
            \n[ \t]*buildAndroidVariant\([ \t]*AndroidBuildConfig\{\n
            [\s\S]*?
            \n[ \t]*\}[ \t]*,[ \t]*bindTarget\)[ \t]*\n
            """,
            re.VERBOSE
          )
      
          s2, n = pattern.subn("\n", s, count=1)
      
          if n == 0:
            pattern2 = re.compile(
              r"""
              \n[ \t]*buildAndroidVariant\([ \t]*AndroidBuildConfig\{\n
              [\s\S]*?
              OutputName:\s*"libbox-legacy\.aar",\n
              [\s\S]*?
              \n[ \t]*\}[ \t]*,[ \t]*bindTarget\)[ \t]*\n
              """,
              re.VERBOSE
            )
            s2, n2 = pattern2.subn("\n", s, count=1)
            if n2 == 0:
              print("Legacy markers found but patch pattern did not match; no changes made.", file=sys.stderr)
              sys.exit(1)
      
          p.write_text(s2)
          print("Patched legacy block removed:", p)
          PY
      
          gofmt -w "$FILE" || true
      
          if grep -q 'libbox-legacy\.aar' "$FILE"; then
            echo "::error::legacy AAR build still present after patch"
            grep -n 'libbox-legacy\.aar' "$FILE" || true
            exit 1
          fi
      
          echo "✔ Removed Android API 21 legacy AAR block."

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.build_go_version }}
          check-latest: true
          cache-dependency-path: "**/go.sum"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ matrix.build_ndk_version }}

      - name: Setup OpenJDK
        run: |
          sudo apt update && sudo apt install -y openjdk-${{ matrix.build_jdk_version }}-jdk-headless
          /usr/lib/jvm/java-${{ matrix.build_jdk_version }}-openjdk-amd64/bin/java --version

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install Custom Go Mobile Tools
        if: ${{ matrix.lib_install_cmd != '' }}
        run: ${{ matrix.lib_install_cmd }}

      - name: Build Go Library (.aar)
        run: ${{ matrix.lib_build_cmd }}
        env:
          JAVA_HOME: /usr/lib/jvm/java-${{ matrix.build_jdk_version }}-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      # - name: Update Android Version
      #   if: ${{ matrix.version_update_cmd != '' }}
      #   run: ${{ matrix.version_update_cmd }}

      - name: Decode Keystore and Setup Properties
        run: |
          echo "--> Decoding Keystore..."
          echo -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > ${{ matrix.client_path }}/app/release.keystore
          echo "--> Creating local.properties..."
          echo -n "${{ secrets.LOCAL_PROPERTIES }}" | base64 --decode > ${{ matrix.client_path }}/local.properties
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          
      - name: Build Android APK
        id: build_apk
        run: |
          set -eux
          ls -alh
          CLIENT_DIR="${{ matrix.client_path }}"
          AAR_GLOB='${{ matrix.aar_name }}'
          
          echo "--> Moving .aar library to Android project..."
          mkdir -p "${CLIENT_DIR}/app/libs"

          mapfile -t aar_files < <(find . -type f -name "${AAR_GLOB}" -print)
          if [ ${#aar_files[@]} -eq 0 ]; then
            echo "ERROR: No AAR matched pattern: ${AAR_GLOB}"
            exit 1
          fi
          echo "Matched AAR(s):"
          printf ' - %s\n' "${aar_files[@]}"
          
          cp -v "${aar_files[@]}" "${CLIENT_DIR}/app/libs/"
          
          echo "--> Building APK with Gradle..."
          cd "${CLIENT_DIR}"
          chmod +x ./gradlew
          ./gradlew ${{ matrix.gradle_task }}
        env:
          JAVA_HOME: /usr/lib/jvm/java-${{ matrix.build_jdk_version}}-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}

      - name: Prepare upload
        run: |
          mkdir -p dist
          cp ${{ matrix.client_path }}/app/build/outputs/apk/play/release/*.apk dist
          cp ${{ matrix.client_path }}/app/build/outputs/apk/other/release/*-universal.apk dist
          cd dist
          for f in SFA-*.apk; do
            case "$f" in
              *-arm64-v8a.apk)      ARCH="arm64-v8a"      ;;
              *-armeabi-v7a.apk)    ARCH="armeabi-v7a"    ;;
              *-x86_64.apk)         ARCH="x86_64"         ;;
              *-x86.apk)            ARCH="x86"            ;;
              *-universal.apk)      ARCH="universal"      ;;
              *-foss-universal.apk) ARCH="foss-universal" ;;
              *) echo "skip $f"; continue ;;
            esac
            mv "$f" "${{ matrix.repo}}-${{matrix.ref}}-${ARCH}.apk"
          done
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.repo }}-${{ matrix.ref }}-android
          path: 'dist'
          if-no-files-found: error
          retention-days: 1
