name: Daily Android APK Build

on:
  workflow_dispatch:
    inputs:
      refs:
        description: "Comma-separated refs for sing-box (e.g., main,stable,testing)"
        default: "oldstable,stable,testing"
  schedule:
    - cron: '0 0 * * *'

jobs:
  prepare-android-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - id: generate
        name: Generate and Validate Android Build Matrix
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_JSON='[
            {
              "repo": "sing-box",
              "repo_url": "https://github.com/SagerNet/sing-box.git",
              "go_version": "1.27",
              "ndk_version": "r28",
              "jdk_version": "17",
              "client_path": "clients/android",
              "gradle_task": ":app:assembleOtherRelease",
              "android_client_repo_url": "https://github.com/SagerNet/sing-box-for-android.git",
              "libbox_tags": "with_gvisor,with_quic,with_utls,badlinkname,tfogo_checklinkname0",
              "refs_default": ["stable", "testing"]
            },
            {
              "repo": "sing-box",
              "repo_url": "https://github.com/SagerNet/sing-box.git",
              "go_version": "1.27",
              "ndk_version": "r28",
              "jdk_version": "17",
              "client_path": "clients/android",
              "gradle_task": ":app:assembleOtherRelease",
              "android_client_repo_url": "https://github.com/SagerNet/sing-box-for-android.git",
              "libbox_tags": "with_gvisor,with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0",
              "refs_default": ["oldstable"]
            },
            {
              "repo": "sing-box-custom",
              "repo_url": "https://github.com/XavierAlpha/sing-box.git",
              "go_version": "1.27",
              "ndk_version": "r28",
              "jdk_version": "17",
              "client_path": "clients/android",
              "gradle_task": ":app:assembleOtherRelease",
              "android_client_repo_url": "https://github.com/XavierAlpha/sing-box-for-android.git",
              "libbox_tags": "with_gvisor,with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0",
              "refs_default": ["stable"]
            }
          ]'

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DISPATCH_REFS="${{ inputs.refs }}"
          else
            DISPATCH_REFS=""
          fi

          MATRIX='[]'
          mapfile -t REPO_ROWS < <(echo "${CONFIG_JSON}" | jq -c '.[]')

          for ROW in "${REPO_ROWS[@]}"; do
            REPO="$(echo "${ROW}" | jq -r '.repo')"
            REPO_URL="$(echo "${ROW}" | jq -r '.repo_url')"

            if [[ -n "${DISPATCH_REFS}" ]]; then
              REF_CSV="${DISPATCH_REFS}"
            else
              REF_CSV="$(echo "${ROW}" | jq -r '.refs_default | join(",")')"
            fi

            IFS=',' read -ra REFS <<< "${REF_CSV}"
            for REF in "${REFS[@]}"; do
              REF="$(echo "${REF}" | xargs)"
              [[ -z "${REF}" ]] && continue

              REF_KIND=""
              CHECKOUT_REF="${REF}"
              TAG_REF="${REF#refs/tags/}"
              TAG_REF="${TAG_REF#tags/}"

              if echo "${ROW}" | jq -e --arg ref "${REF}" '.refs_default | index($ref)' >/dev/null; then
                if git ls-remote --exit-code --heads "${REPO_URL}" "${REF}" >/dev/null 2>&1; then
                  REF_KIND="branch"
                elif git ls-remote --exit-code --refs --tags "${REPO_URL}" "refs/tags/${TAG_REF}" >/dev/null 2>&1; then
                  REF="${TAG_REF}"
                  REF_KIND="tag"
                  CHECKOUT_REF="refs/tags/${REF}"
                else
                  echo "skip missing ref: ${REPO} ${REF}"
                  continue
                fi
              elif git ls-remote --exit-code --refs --tags "${REPO_URL}" "refs/tags/${TAG_REF}" >/dev/null 2>&1; then
                REF="${TAG_REF}"
                REF_KIND="tag"
                CHECKOUT_REF="refs/tags/${REF}"
              else
                echo "skip unsupported ref: ${REPO} ${REF}"
                continue
              fi

              ANDROID_CLIENT_REPO_URL="$(echo "${ROW}" | jq -r '.android_client_repo_url')"
              case "${REF_KIND}:${REF}" in
                branch:testing)
                  ANDROID_CLIENT_REF="dev"
                  ANDROID_CLIENT_FETCH_REF="refs/heads/dev"
                  ANDROID_API="24"
                  ;;
                branch:stable)
                  ANDROID_CLIENT_REF="main"
                  ANDROID_CLIENT_FETCH_REF="refs/heads/main"
                  ANDROID_API="24"
                  ;;
                branch:oldstable)
                  ANDROID_CLIENT_REF="stable"
                  ANDROID_CLIENT_FETCH_REF="refs/heads/stable"
                  ANDROID_API="23"
                  ;;
                tag:*)
                  ANDROID_API="23"
                  if git ls-remote --exit-code --refs --tags "${ANDROID_CLIENT_REPO_URL}" "refs/tags/${REF}" >/dev/null 2>&1; then
                    ANDROID_CLIENT_REF="${REF}"
                    ANDROID_CLIENT_FETCH_REF="refs/tags/${REF}"
                  else
                    ANDROID_CLIENT_REF="main"
                    ANDROID_CLIENT_FETCH_REF="refs/heads/main"
                  fi
                  ;;
                *)
                  echo "skip unsupported ref mapping: ${REPO} ${REF}"
                  continue
                  ;;
              esac

              if ! git ls-remote --exit-code "${ANDROID_CLIENT_REPO_URL}" "${ANDROID_CLIENT_FETCH_REF}" >/dev/null 2>&1; then
                echo "skip missing android client ref: ${REPO} ${REF} -> ${ANDROID_CLIENT_REF}"
                continue
              fi

              ENTRY="$(echo "${ROW}" | jq -c \
                --arg ref "${REF}" \
                --arg ref_kind "${REF_KIND}" \
                --arg checkout_ref "${CHECKOUT_REF}" \
                --arg android_client_ref "${ANDROID_CLIENT_REF}" \
                --arg android_client_fetch_ref "${ANDROID_CLIENT_FETCH_REF}" \
                --arg android_api "${ANDROID_API}" \
                '{
                  repo: .repo,
                  repo_url: .repo_url,
                  build_go_version: .go_version,
                  build_ndk_version: .ndk_version,
                  build_jdk_version: .jdk_version,
                  client_path: .client_path,
                  gradle_task: .gradle_task,
                  libbox_tags: .libbox_tags,
                  ref: $ref,
                  ref_kind: $ref_kind,
                  checkout_ref: $checkout_ref,
                  android_client_repo_url: .android_client_repo_url,
                  android_client_ref: $android_client_ref,
                  android_client_fetch_ref: $android_client_fetch_ref,
                  android_api: ($android_api | tonumber)
                }')"

              MATRIX="$(echo "${MATRIX}" | jq -c ". + [${ENTRY}]")"
            done
          done

          if [[ "$(echo "${MATRIX}" | jq 'length')" -eq 0 ]]; then
            echo "No Android build tasks were generated."
            exit 1
          fi

          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  build-apk:
    needs: prepare-android-matrix
    name: Build Android ${{ matrix.repo }} | ${{ matrix.ref }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-android-matrix.outputs.matrix) }}
    steps:
      - name: Extract Owner/Repo from URL
        id: extract_repo
        shell: bash
        run: |
          set -euo pipefail
          REPO_URL="${{ matrix.repo_url }}"
          OWNER_REPO="${REPO_URL#https://github.com/}"
          OWNER_REPO="${OWNER_REPO%.git}"
          echo "owner_repo=${OWNER_REPO}" >> "${GITHUB_OUTPUT}"

      - name: Checkout Source Code
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.extract_repo.outputs.owner_repo }}
          ref: ${{ matrix.checkout_ref }}
          path: source
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.build_go_version }}
          check-latest: true
          cache-dependency-path: source/**/go.sum

      - name: Resolve source version
        id: source_version
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail

          REPO_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          VERSION="${REPO_TAG}"
          if [[ -f "cmd/internal/read_tag/main.go" ]]; then
            if [[ "${{ matrix.ref_kind }}" == "tag" ]]; then
              VERSION="${{ matrix.ref }}"
            else
              case "${{ matrix.ref }}" in
                testing)
                  VERSION="$(go run ./cmd/internal/read_tag --nightly)"
                  ;;
                oldstable|stable)
                  VERSION="$(go run ./cmd/internal/read_tag)"
                  ;;
                *)
                  echo "::error title=Unsupported sing-box branch::Unsupported branch ref: ${{ matrix.ref }}"
                  exit 1
                  ;;
              esac
            fi
          else
            echo "::warning title=Using fallback version resolution::Missing sing-box read_tag helper at commit $(git rev-parse HEAD); falling back to nearest Git tag: ${REPO_TAG:-<none>}"
          fi
          if [[ -z "${VERSION}" || "${VERSION}" == "unknown" ]]; then
            echo "::error title=Version resolution failed::No tag version found for ${{ matrix.repo }} at commit $(git rev-parse HEAD)"
            exit 1
          fi
          VERSION="${VERSION%-dirty}"
          VERSION="${VERSION#v}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          if [[ "${VERSION}" == *"-${SHORT_SHA}" ]]; then
            echo "::notice title=Normalize source version::Removing commit suffix -${SHORT_SHA} from ${VERSION}"
            VERSION="${VERSION%-${SHORT_SHA}}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "::notice title=Resolved sing-box version::${VERSION}"

      - name: Prepare Android client source
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git submodule update --init --recursive clients/android
          git -C clients/android remote set-url origin "${{ matrix.android_client_repo_url }}"
          git -C clients/android fetch --depth=1 origin "${{ matrix.android_client_fetch_ref }}"
          git -C clients/android checkout --detach FETCH_HEAD
          git -C clients/android submodule update --init --recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.build_jdk_version }}
          cache: gradle

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ matrix.build_ndk_version }}

      - name: Install Go Mobile Tools
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          go install -v github.com/sagernet/gomobile/cmd/gomobile@latest
          go install -v github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Build Custom libbox.aar
        shell: bash
        working-directory: source
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          SOURCE_VERSION: ${{ steps.source_version.outputs.version }}
        run: |
          set -euo pipefail

          VERSION="${SOURCE_VERSION}"
          LDFLAGS_SHARED_FALLBACK="-X runtime.godebugDefault=multipathtcp=0 -checklinkname=0"
          if [[ -f "release/LDFLAGS" ]]; then
            LDFLAGS_SHARED="$(tr -d '\r\n' < release/LDFLAGS)"
          else
            LDFLAGS_SHARED="${LDFLAGS_SHARED_FALLBACK}"
          fi
          FINAL_LDFLAGS="-X github.com/sagernet/sing-box/constant.Version=${VERSION} ${LDFLAGS_SHARED}"
          FINAL_LDFLAGS="$(echo "${FINAL_LDFLAGS}" | xargs)"
          FINAL_LDFLAGS="${FINAL_LDFLAGS:+${FINAL_LDFLAGS} }-s -w -buildid="

          echo "::group::Final Build Flags (${{ matrix.repo }}/${{ matrix.ref }}/libbox)"
          cat <<EOF
          android_client: ${{ matrix.android_client_repo_url }} @ ${{ matrix.android_client_ref }}
          android_api: ${{ matrix.android_api }}
          build_tags: ${{ matrix.libbox_tags }}
          version: ${VERSION}
          ldflags: ${FINAL_LDFLAGS}
          EOF
          echo "::endgroup::"

          go run ./cmd/internal/build gomobile bind -v \
            -o libbox.aar \
            -target android \
            -androidapi ${{ matrix.android_api }} \
            -javapkg=io.nekohasekai \
            -libname=box \
            -trimpath \
            -buildvcs=false \
            -ldflags "${FINAL_LDFLAGS}" \
            -tags "${{ matrix.libbox_tags }}" \
            ./experimental/libbox

          mkdir -p "${{ matrix.client_path }}/app/libs"
          cp -f libbox.aar "${{ matrix.client_path }}/app/libs/libbox.aar"

      - name: Decode Keystore and Setup Properties
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          echo -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > "${{ matrix.client_path }}/app/release.keystore"
          echo -n "${{ secrets.LOCAL_PROPERTIES }}" | base64 --decode > "${{ matrix.client_path }}/local.properties"

      - name: Build Android APK
        shell: bash
        working-directory: source/${{ matrix.client_path }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon ${{ matrix.gradle_task }}

      - name: Prepare upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          shopt -s nullglob
          APK_FILES=(
            source/${{ matrix.client_path }}/app/build/outputs/apk/other/release/*.apk
          )

          if [[ ${#APK_FILES[@]} -eq 0 ]]; then
            echo "No APK found to upload."
            exit 1
          fi

          SAFE_REF="${{ matrix.ref }}"
          SAFE_REF="${SAFE_REF//\//_}"
          SAFE_REF="${SAFE_REF//:/_}"

          for FILE in "${APK_FILES[@]}"; do
            BASE="$(basename "${FILE}")"
            cp -f "${FILE}" "dist/${{ matrix.repo }}-${SAFE_REF}-${BASE}"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.repo }}-${{ matrix.ref }}-android
          path: dist
          if-no-files-found: error
          retention-days: 1
